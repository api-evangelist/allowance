aid: allowance
name: Allowance
description: >-
  Allowance is a consumer trust layer for AI agent payments, backed by Y Combinator.
  It lets people give AI agents limited, revocable spending power without ever sharing
  a real credit card number. An agent proposes a spending mandate (a permission object
  with a budget, merchant and category restrictions, and a time limit); the human owner
  approves it from the Allowance iOS app; and Allowance then issues single-use virtual
  cards (PAN, expiry, CVV) that are amount-capped, merchant-locked, and short-lived so
  the agent can complete checkout autonomously within the approved rules. Allowance
  exposes a pre-launch OpenAPI 3.1 REST API, a hosted remote MCP server, a published
  agent SKILL.md, a CLI (PyPI and npm), plus ChatGPT and Claude connectors. The mandate
  model is designed as a natural precursor to the AP2 Agent Payments Protocol.
